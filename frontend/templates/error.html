{% extends "base.html" %}

{% block title %}{{ title }} | Aegis{% endblock %}

{% block content %}
<style>
.error-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px 16px;
}

.error-panel {
  width: min(560px, 100%);
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(199, 210, 254, 0.9);
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 20px 48px rgba(79, 70, 229, 0.12);
  text-align: center;
}

.error-code {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 72px;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  background: #eef2ff;
  color: #4f46e5;
  font-weight: 800;
  margin-bottom: 18px;
}

.error-panel h1 {
  margin: 0 0 10px;
  color: #111827;
  font-size: 2rem;
  line-height: 1.15;
}

.error-panel p {
  margin: 0 auto 24px;
  color: #4b5563;
  font-size: 1rem;
  max-width: 420px;
}

.error-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.error-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 18px;
  border-radius: 10px;
  background: #4f46e5;
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
}

.error-action.secondary {
  background: #eef2ff;
  color: #4f46e5;
}
</style>

<main class="error-page">
  <section class="error-panel" aria-labelledby="error-title">
    <div class="error-code">{{ status_code }}</div>
    <h1 id="error-title">{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="error-actions">
      <a class="error-action" href="{{ action_url }}">
        <i class="fa-solid fa-house"></i>
        {{ action_label }}
      </a>
      <a class="error-action secondary" href="javascript:history.back()">
        <i class="fa-solid fa-arrow-left"></i>
        Go back
      </a>
    </div>
  </section>
</main>
{% endblock %}
