{% extends "base.html" %}

{% block title %}Forgot Password - Aegis{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="margin-bottom: 20px;">
            <a href="{{ url_for('settings_profile') }}" style="display: inline-flex; align-items: center; gap: 8px; color: #4f46e5; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Settings</span>
            </a>
        </div>
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email address to receive a verification code</p>

        <form method="POST" class="auth-form" id="forgot-password-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                {% if error %}
                <div class="error-message-box">
                    <span class="error-icon">⚠</span> {{ error }}
                </div>
                {% endif %}
                <input type="email" id="email" name="email" class="form-input {% if error %}input-error{% endif %}"
                       placeholder="Enter your email address" value="{{ email or '' }}" required>
            </div>

            <button type="submit" class="btn btn-primary" id="send-code-btn">Send Verification Code</button>
        </form>

        <p class="switch-link">
            Remember your password?
            <a href="{{ url_for('login') }}">Back to Login</a>
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('forgot-password-form');
    const button = document.getElementById('send-code-btn');

    if (!form || !button) {
        return;
    }

    form.addEventListener('submit', function() {
        if (!form.checkValidity()) {
            return;
        }

        button.disabled = true;
        button.textContent = 'Sending...';
    });
});
</script>
{% endblock %}
